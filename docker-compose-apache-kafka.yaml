services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://broker:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://broker:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: EXTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT, CONTROLLER:PLAINTEXT, INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
    networks:
      - kafka-network
    depends_on:
      - broker

  producer-app:
    container_name: producer-app
    build:
      context: ./apache-kafka-producer-app/kafka-producer-app
    ports:
      - "8090:8090"
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      TOPIC_NAME: ufabc.tcc.topic
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 128m
    networks:
      - kafka-network
    depends_on:
      - broker

  consumer-app:
    container_name: consumer-app
    build:
      context: ./apache-kafka-consumer-app/kafka-consumer-app
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      TOPIC_NAME: ufabc.tcc.topic
      GROUP_ID: ufabc.consumer
      OFFSET_RESET_CONFIG: latest
      POLL_FREQUENCY_MILLIS: 10000
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 90m
    networks:
      - kafka-network
    depends_on:
      - broker

networks:
  kafka-network:
    driver: bridge
# Apply quota to producer by clientId
# docker exec -it 75e /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --alter --add-config 'producer_byte_rate=1048' --entity-type clients --entity-name my-producer-app